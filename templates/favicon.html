{% load static %}
<!-- icons: same set as templates/studio/index.html; `?v=` makes browsers drop cached copies -->
<link rel="icon" type="image/svg+xml" href="{% static 'studio/icons/icon-small.svg' %}?v={{ APP_VERSION }}">
<link rel="icon" type="image/png" sizes="32x32" href="{% static 'studio/icons/favicon-32.png' %}?v={{ APP_VERSION }}">
<link rel="icon" type="image/png" sizes="48x48" href="{% static 'studio/icons/favicon-48.png' %}?v={{ APP_VERSION }}">
<link rel="apple-touch-icon" sizes="180x180" href="{% static 'studio/icons/apple-touch-icon.png' %}?v={{ APP_VERSION }}">
