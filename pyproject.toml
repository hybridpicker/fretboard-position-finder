[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "fretboard.settings_test"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::django.utils.deprecation.RemovedInDjango50Warning"]

[tool.coverage.run]
source = ["positionfinder", "api", "utils", "fretboard"]
branch = true
omit = [
    "*/migrations/*",
    "*/tests/*",
    "manage.py",
    "fretboard/settings.py",
    "fretboard/settings_test.py",
    "fretboard/wsgi.py",
    "fretboard/asgi.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude", "static", "scripts/legacy", "*/migrations/*"]
required-version = ">=0.17"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "DJ"]
ignore = [
    "DJ001",  # nullable CharField/TextField are part of the existing schema (no model changes allowed)
    "E501",   # the formatter wraps code; the remaining long lines are strings, comments and URLs
    "UP031",  # %-formatting in a few legacy strings; rewriting risks subtle output changes
    "DJ012",  # reordering model bodies is churn without benefit; schema must stay untouched
    "DJ008",  # models without __str__ are part of the existing schema
]

[tool.ruff.lint.per-file-ignores]
"fretboard/settings_test.py" = ["F403", "F405"]  # star import of the base settings is intentional
"tests/**" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["positionfinder", "api", "fretboard", "utils", "tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
plugins = ["mypy_django_plugin.main"]
exclude = ["migrations/", "tests/", "scripts/", "static/"]

[tool.django-stubs]
django_settings_module = "fretboard.settings_test"
