repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: pytest-unit
        name: pytest (unit tests)
        entry: python -m pytest tests/unit -q -x
        language: system
        pass_filenames: false
        types: [python]
